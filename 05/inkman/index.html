<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Inkman - Three.js Boilerplate</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<style>
			html, body {
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
				background: #000;
				overflow: hidden;
			}
			canvas { display: block; }
		</style>
	</head>
	<body>
		<!-- Stats.js performance widget -->
		<script src="https://mrdoob.github.io/stats.js/build/stats.min.js"></script>
		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
				}
			}
		</script>
		<script type="module">
			import * as THREE from 'three';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { AnaglyphEffect } from 'three/addons/effects/AnaglyphEffect.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { VertexNormalsHelper } from 'three/addons/helpers/VertexNormalsHelper.js';
			import { Pane } from 'https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/dist/tweakpane.min.js';

			let renderer, effect, scene, camera, controls;
			let stats;
			let polyMesh = null;
			let editedMesh = null;

			// Step 10 helper state
			window.SCENE = {
				poly: null,
				rotate_poly: false,
				do_rotate_poly() { this.rotate_poly = !this.rotate_poly; }
				,
				// Step 11: Blender mesh + normals helper + material toggle
				blender: null,
				blender_helper: null,
				blender_old_material: null,
				// Blender rotation toggle
				rotate_blender: false,
				do_rotate_blender() { this.rotate_blender = !this.rotate_blender; },
				change_material() {
					if (!this.blender) return;
					// Ensure target is a Mesh with a material
					const target = this.blender;
					if (!target.isMesh || !target.material) return;
					// Toggle: store original once, then swap
					if (!this.blender_old_material) {
						this.blender_old_material = target.material.clone();
						target.material = new THREE.MeshNormalMaterial();
					} else {
						target.material = this.blender_old_material.clone();
						this.blender_old_material = null;
					}
				}
			};

			function onWindowResize() {
				const w = window.innerWidth;
				const h = window.innerHeight;
				camera.aspect = w / h;
				camera.updateProjectionMatrix();
				renderer.setSize(w, h);
				effect.setSize(w, h);
			}

			function animate() {
				requestAnimationFrame(animate);
				controls.update();
				// update stats each frame
				if (stats) stats.update();
				// Step 10: slerp rotation for poly
				if (window.SCENE && window.SCENE.poly) {
					const qId = new THREE.Quaternion(0, 0, 0, 1);
					const q180 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI);
					const target = window.SCENE.rotate_poly ? q180 : qId;
					window.SCENE.poly.quaternion.slerp(target, 0.01);
				}
				// Step 11: when normals helper is visible, update it after transforms
				if (window.SCENE && window.SCENE.blender_helper && window.SCENE.blender_helper.visible) {
					window.SCENE.blender_helper.update();
				}
				// Blender mesh rotation toggle with slerp
				if (window.SCENE && window.SCENE.blender) {
					const qIdB = new THREE.Quaternion(0, 0, 0, 1);
					const q180B = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI);
					const targetB = window.SCENE.rotate_blender ? q180B : qIdB;
					window.SCENE.blender.quaternion.slerp(targetB, 0.01);
				}
				effect.render(scene, camera);
			}

			window.onload = () => {
				renderer = new THREE.WebGLRenderer({ antialias: true });
				renderer.setPixelRatio(window.devicePixelRatio);
				renderer.setSize(window.innerWidth, window.innerHeight);
				renderer.setClearColor(0x000000, 1);
				document.body.appendChild(renderer.domElement);

				// stats.js widget
				stats = new window.Stats();
				document.body.appendChild(stats.domElement);

				let eyeSep = 0.001;
				effect = new AnaglyphEffect(renderer, eyeSep);
				effect.setSize(window.innerWidth, window.innerHeight);

				scene = new THREE.Scene();

				camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 10000);
				camera.position.set(0, 10, 0);

				// Lights (Directional + Ambient)
				const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
				dirLight.position.set(5, 10, 7.5);
				scene.add(dirLight);

				const ambientLight = new THREE.AmbientLight(0xffffff, 0.25);
				scene.add(ambientLight);

				controls = new OrbitControls(camera, renderer.domElement);
				controls.enableDamping = true;
				controls.dampingFactor = 0.05;

				// Tweakpane UI (create early so buttons exist even before models load)
				const pane = new Pane();
				const sceneui = pane.addFolder({ title: 'Scene' });
				const lightui = pane.addFolder({ title: 'Light' });
				const cameraui = pane.addFolder({ title: 'Camera' });
				const modelsui = pane.addFolder({ title: 'Models' });
				const blenderui = pane.addFolder({ title: 'Blender Mesh' });
				blenderui.addButton({ title: 'rotate!' }).on('click', () => { window.SCENE.do_rotate_blender(); });
				blenderui.addButton({ title: 'Change Material!' }).on('click', () => { window.SCENE.change_material(); });
				// Keep a reference so we can add wireframe later when material is ready
				const polyui = pane.addFolder({ title: 'PolyCam Mesh' });
				polyui.addButton({ title: 'rotate!' }).on('click', () => { window.SCENE.do_rotate_poly(); });

				// Scene controls
				sceneui.addBinding({ value: ambientLight.intensity }, 'value', { label: 'Ambient', min: 0, max: 2, step: 0.01 }).on('change', (ev) => {
					ambientLight.intensity = ev.value;
				});
				sceneui.addBinding({ value: dirLight.intensity }, 'value', { label: 'Directional', min: 0, max: 5, step: 0.01 }).on('change', (ev) => {
					dirLight.intensity = ev.value;
				});
				sceneui.addBinding({ value: eyeSep }, 'value', { label: 'Eye Sep', min: 0, max: 0.02, step: 0.0005 }).on('change', (ev) => {
					// Rebuild effect with new eye separation
					eyeSep = ev.value;
					const newEffect = new AnaglyphEffect(renderer, eyeSep);
					newEffect.setSize(window.innerWidth, window.innerHeight);
					effect = newEffect;
				});

				// Light controls
				lightui.addBinding({ value: dirLight.position.x }, 'value', { label: 'Dir X', min: -20, max: 20, step: 0.1 }).on('change', (ev) => { dirLight.position.x = ev.value; });
				lightui.addBinding({ value: dirLight.position.y }, 'value', { label: 'Dir Y', min: -20, max: 20, step: 0.1 }).on('change', (ev) => { dirLight.position.y = ev.value; });
				lightui.addBinding({ value: dirLight.position.z }, 'value', { label: 'Dir Z', min: -20, max: 20, step: 0.1 }).on('change', (ev) => { dirLight.position.z = ev.value; });
				lightui.addBinding({ value: '#ffffff' }, 'value', { label: 'Dir Color' }).on('change', (ev) => { dirLight.color.set(ev.value); });
				lightui.addBinding({ value: '#ffffff' }, 'value', { label: 'Amb Color' }).on('change', (ev) => { ambientLight.color.set(ev.value); });

				// Camera controls
				cameraui.addBinding({ value: camera.position.x }, 'value', { label: 'Cam X', min: -50, max: 50, step: 0.1 }).on('change', (ev) => { camera.position.x = ev.value; });
				cameraui.addBinding({ value: camera.position.y }, 'value', { label: 'Cam Y', min: -50, max: 50, step: 0.1 }).on('change', (ev) => { camera.position.y = ev.value; });
				cameraui.addBinding({ value: camera.position.z }, 'value', { label: 'Cam Z', min: -50, max: 50, step: 0.1 }).on('change', (ev) => { camera.position.z = ev.value; });

				// Model controls
				modelsui.addBinding({ value: 10 }, 'value', { label: 'Poly Scale', min: 0.1, max: 50, step: 0.1 }).on('change', (ev) => {
					if (polyMesh) polyMesh.scale.set(ev.value, ev.value, ev.value);
				});
				modelsui.addBinding({ value: 10 }, 'value', { label: 'Edited Scale', min: 0.1, max: 50, step: 0.1 }).on('change', (ev) => {
					if (editedMesh) editedMesh.scale.set(ev.value, ev.value, ev.value);
				});
				modelsui.addBinding({ value: 0 }, 'value', { label: 'Poly Y', min: -20, max: 20, step: 0.1 }).on('change', (ev) => {
					if (polyMesh) polyMesh.position.y = ev.value;
				});
				modelsui.addBinding({ value: 0 }, 'value', { label: 'Edited Y', min: -20, max: 20, step: 0.1 }).on('change', (ev) => {
					if (editedMesh) editedMesh.position.y = ev.value;
				});

				// Load original mesh (poly.glb)
				const loader = new GLTFLoader();
				loader.load(
					'poly.glb',
					(gltf) => {
						const poly = gltf.scenes?.[0]?.children?.[0] ?? gltf.scene;
						if (poly) {
							// Reset rotation to identity quaternion
							poly.quaternion.set(0, 0, 0, 1);
							// Scale up
							poly.scale.set(10, 10, 10);
							  // Nudge to the left to avoid overlap (closer spacing)
							  poly.translateX(-2);
							scene.add(poly);
							polyMesh = poly;
							window.SCENE.poly = poly;
							// Add wireframe binding now that material exists
							if (poly.material) {
								polyui.addBinding(poly.material, 'wireframe', { label: 'Wireframe' });
							}
						} else {
							console.warn('GLTF loaded but no child mesh found (poly.glb)');
						}
					},
					undefined,
					(error) => {
						console.error('Error loading poly.glb:', error);
					}
				);

				// Load edited mesh (editedpoly.glb) and place next to original
				const loader2 = new GLTFLoader();
				loader2.load(
					'editedpoly.glb',
					(gltf) => {
						const edited = gltf.scenes?.[0]?.children?.[0] ?? gltf.scene;
						if (edited) {
							// Reset rotation to identity quaternion
							edited.quaternion.set(0, 0, 0, 1);
							// Scale up
							edited.scale.set(10, 10, 10);
							  // Nudge to the right to sit beside original (closer spacing)
							  edited.translateX(2);
							// Keep original material; toggling is handled via the UI button
							scene.add(edited);
							editedMesh = edited;
							window.SCENE.blender = edited;

							// Vertex normals helper for Blender mesh
							const helper = new VertexNormalsHelper(edited, 0.1, 'blue');
							helper.visible = false;
							scene.add(helper);
							window.SCENE.blender_helper = helper;
							blenderui.addBinding(helper, 'visible', { label: 'Show normals!' });
						} else {
							console.warn('GLTF loaded but no child mesh found (editedpoly.glb)');
						}
					},
					undefined,
					(error) => {
						console.error('Error loading editedpoly.glb:', error);
					}
				);

				window.addEventListener('resize', onWindowResize);
				animate();
			};
		</script>
	</body>
	</html>
